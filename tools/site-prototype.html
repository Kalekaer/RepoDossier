<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>本地开源项目库 · 原型（首页/日报/全库/计划/图例）</title>
<style>
/* ============================================================================
   原型：5 页合一（hash 路由）+ 数据驱动 + 可点浮窗 + 素材轮换
   · 日报循环：picks/rejects 用循环渲染，数量 0..N 自适应
   · 全库：229 条起（可继续增长）· 搜索/分类/分页
   · 浮窗：所有项目字段（分类/星级/档位/徽章/一句话/为什么/适合谁/仓库）
   · 图片：9 张 NASA 公有领域，按 seed 哈希轮换（不总是一张）
   · 字体：Smiley Sans / Bebas / Marker / Caveat（OFL & Apache）+ 系统楷体
   · 音效：默认关闭，右上角开关（WebAudio 合成，无音频文件）
   ============================================================================ */
@font-face{font-family:"Smiley";src:url("../../assets/fonts/SmileySans.woff2") format("woff2");font-display:swap}
@font-face{font-family:"Bebas";src:url("../../assets/fonts/BebasNeue-Regular.ttf") format("truetype");font-display:swap}
@font-face{font-family:"Marker";src:url("../../assets/fonts/PermanentMarker-Regular.ttf") format("truetype");font-display:swap}
:root{
  --ink:#0b0b0b; --ink2:#141414; --paper:#f4f0e3; --paper2:#e9e3d2;
  --fluoro:#e9ff2e; --magenta:#ff1f6b; --cyan:#2ef2d0; --grey:#8a8a84;
  --disp:"Smiley","Noto Sans SC",sans-serif;
  --latin:"Bebas","Arial Narrow",Impact,sans-serif;
  --marker:"Marker","Arial Black",sans-serif;
  --kai:"KaiTi","STKaiti","楷体",serif;
  --mono:SFMono-Regular,Menlo,Consolas,monospace;
  --sans:"Noto Sans SC","Microsoft YaHei UI",system-ui,sans-serif;
  --t:.24s cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--paper);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}
.hud{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:18px;padding:8px 18px;
  background:rgba(11,11,11,.94);border-bottom:2px solid var(--paper);backdrop-filter:blur(4px)}
.hud .brand{font-family:var(--latin);font-size:26px;line-height:1;letter-spacing:0}
.hud .brand span{color:var(--fluoro)}
.hud .navlinks{display:flex;gap:2px}
.hud .navlinks a{text-decoration:none;padding:6px 10px;font:700 10px/1 var(--mono);letter-spacing:.16em;
  text-transform:uppercase;color:var(--grey);border:1px solid transparent;transition:color var(--t),background var(--t),border-color var(--t)}
.hud .navlinks a:hover{color:var(--paper)}
.hud .navlinks a.on{color:var(--ink);background:var(--fluoro);border-color:var(--fluoro)}
.hud .sp{flex:1}
.hud .meta{font:600 9.5px/1.5 var(--mono);letter-spacing:.14em;color:var(--grey);text-transform:uppercase;text-align:right}
.hud .meta b{color:var(--paper)}
.snd{cursor:pointer;border:1px solid var(--grey);background:none;color:var(--grey);font:700 9px/1 var(--mono);
  letter-spacing:.14em;padding:5px 7px}
.snd.on{border-color:var(--fluoro);color:var(--fluoro)}

.view{display:none;max-width:1400px;margin:0 auto;padding:16px 18px 60px}
.view.on{display:block;animation:vin .32s cubic-bezier(.2,.8,.2,1) both}
@keyframes vin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view.on{animation:none}*{transition:none!important}}

/* 通用件 */
.lab{font:700 10px/1.4 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--grey)}
.h1{font-family:var(--disp);font-weight:400;line-height:.88;letter-spacing:-.02em;margin:0}
.h1 em{font-style:normal;color:var(--fluoro)}
.rule{height:6px;background:var(--paper);margin:12px 0}
.btn{border:2px solid var(--paper);background:none;color:var(--paper);font:700 10px/1 var(--mono);letter-spacing:.16em;
  padding:8px 11px;cursor:pointer;text-transform:uppercase;transition:background var(--t),color var(--t),border-color var(--t)}
.btn:hover{background:var(--fluoro);color:var(--ink);border-color:var(--fluoro)}
.btn:disabled{opacity:.28;cursor:not-allowed}
.chip{display:inline-block;border:1px solid var(--grey);color:var(--grey);font:600 9px/1 var(--mono);letter-spacing:.12em;padding:3px 6px;text-transform:uppercase}

/* ---------- 首页 ---------- */
.hero{position:relative;height:520px;border:6px solid var(--paper);overflow:hidden;margin-bottom:14px}
.hero .bg{position:absolute;inset:0;background:#111 center/cover;filter:grayscale(1) contrast(1.5) brightness(.5)}
.hero .bg::after{content:"";position:absolute;inset:0;background:var(--fluoro);opacity:.13;mix-blend-mode:multiply}
.hero .in{position:absolute;left:0;right:0;bottom:0;padding:16px 20px 18px;background:linear-gradient(0deg,rgba(11,11,11,.96),rgba(11,11,11,.6) 70%,transparent)}
.hero .k{display:inline-block;background:var(--magenta);color:#fff;font:700 10px/1 var(--mono);letter-spacing:.2em;padding:5px 8px}
.hero h1{font-size:96px;margin:8px 0 6px}
.hero .dek{font:12px/1.6 var(--mono);color:#cfcfc8;border-left:3px solid var(--magenta);padding-left:9px;max-width:62ch}
.hero .num{position:absolute;right:18px;top:14px;font-family:var(--latin);font-size:112px;line-height:.8;color:var(--fluoro)}
.entries{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.entry{display:block;text-decoration:none;background:var(--paper);color:var(--ink);padding:14px;position:relative;
  transition:transform var(--t),background var(--t)}
.entry:hover{transform:translateY(-3px);background:#fff}
.entry .n{font-family:var(--latin);font-size:32px;line-height:.8;color:var(--magenta)}
.entry .t{display:block;font:900 20px/1.05 var(--sans);letter-spacing:-.02em;margin:6px 0 4px}
.entry .d{font:10px/1.5 var(--mono);color:#55554f}
.entry.sel{background:var(--fluoro)}
.entry.sel .n{color:var(--ink)}
.viz{display:grid;grid-template-columns:1.4fr 1fr;gap:10px}
.box{border:2px solid var(--paper);padding:12px 14px}
.box .h{display:flex;justify-content:space-between;margin-bottom:8px}
.catrow{display:grid;grid-template-columns:88px 1fr 40px;gap:8px;align-items:center;margin-bottom:4px;font-size:11px}
.catrow .b{height:11px;background:#242422;position:relative}
.catrow .b i{position:absolute;left:0;top:0;bottom:0;background:var(--fluoro)}
.catrow .b i.m{background:var(--magenta)}
.catrow b{font-family:var(--latin);font-size:15px;text-align:right}
.spark{display:flex;align-items:flex-end;gap:5px;height:96px}
.spark .c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px}
.spark .c i{width:100%;background:var(--fluoro)}
.spark .c:last-child i{background:var(--magenta)}
.spark .c b{font:700 9px/1 var(--mono)}
.spark .c span{font:600 7px/1 var(--mono);color:var(--grey)}

/* ---------- 日报（循环 + 自适应） ---------- */
.mast{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;border-bottom:6px solid var(--paper);padding-bottom:8px}
.mast h1{font-size:82px}
.mast .right{text-align:right;font:600 9.5px/1.7 var(--mono);letter-spacing:.14em;color:var(--grey);text-transform:uppercase}
.mast .right b{display:block;font-family:var(--latin);font-size:34px;letter-spacing:0;color:var(--paper)}
.dstats{display:flex;gap:16px;flex-wrap:wrap;padding:8px 0;border-bottom:2px solid var(--paper);font:600 10px/1.5 var(--mono);letter-spacing:.12em;color:var(--grey);text-transform:uppercase}
.dstats b{color:var(--paper);font-family:var(--latin);font-size:15px;letter-spacing:0}
.dlead{display:grid;grid-template-columns:1.5fr 1fr;gap:0;border-bottom:6px solid var(--paper)}
.dlead .l{padding:14px 14px 16px 0;border-right:6px solid var(--paper)}
.dlead .r{background:var(--paper);color:var(--ink);padding:12px}
.dlead h2{font-family:var(--disp);font-weight:400;font-size:52px;line-height:.92;margin:6px 0 8px}
.dlead .dek{font:12px/1.6 var(--mono);color:#cfcfc8}
.pickrow{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid #262624;
  cursor:pointer;transition:background var(--t)}
.pickrow:hover{background:#161616}
.pickrow .no{font-family:var(--latin);font-size:24px;line-height:1;color:var(--magenta)}
.pickrow .nm{font:700 12px/1.3 var(--mono);color:var(--paper);word-break:break-all}
.pickrow .one{margin-top:3px;font:12px/1.5 var(--kai);color:#cfcfc8;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pickrow .m{font:600 9px/1.6 var(--mono);color:var(--grey);text-align:right;text-transform:uppercase}
.emptyrep{border:2px dashed #333;padding:18px;text-align:center;font:400 18px/1.4 var(--kai);color:var(--grey)}
.rej{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:12px 0;border-top:6px solid var(--paper)}
.rej .tt{font-family:var(--latin);font-size:30px;line-height:.85;color:var(--magenta)}
.rej .items{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.rej .it{border-left:2px solid #333;padding-left:8px}
.rej .it b{display:block;font:700 10px/1.35 var(--mono);word-break:break-all}
.rej .it span{display:block;font:9px/1.4 var(--mono);color:var(--grey);margin-top:2px}

/* ---------- 全库 ---------- */
.libbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}
.libbar .search{flex:1;min-width:240px;display:flex;align-items:center;gap:8px;border:2px solid var(--paper);padding:7px 10px}
.libbar input{flex:1;background:none;border:0;outline:0;color:var(--paper);font:14px/1.4 var(--sans)}
.catts{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.cat{background:none;border:1px solid var(--grey);color:var(--grey);font:700 9.5px/1 var(--mono);letter-spacing:.1em;
  padding:5px 7px;cursor:pointer;transition:all var(--t)}
.cat:hover{color:var(--paper);border-color:var(--paper)}
.cat.on{background:var(--fluoro);color:var(--ink);border-color:var(--fluoro)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.pcard{background:var(--paper);color:var(--ink);padding:0;cursor:pointer;position:relative;overflow:hidden;
  transition:transform var(--t),box-shadow var(--t);box-shadow:0 8px 18px -14px #000}
.pcard:hover{transform:translateY(-4px);box-shadow:0 18px 28px -16px #000}
.pcard .ph{height:104px;background:#c9c2ae center/cover;filter:grayscale(1) contrast(1.35) brightness(.85)}
.pcard .bd{padding:9px 10px 10px}
.pcard .nm{font:700 11.5px/1.3 var(--mono);word-break:break-all}
.pcard .one{margin:4px 0 0;font:12px/1.45 var(--kai);color:#3a352c;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcard .ft{display:flex;justify-content:space-between;margin-top:6px;font:600 9px/1 var(--mono);color:#6d6555}
.pcard .tagl{position:absolute;left:0;top:0;background:var(--ink);color:var(--paper);font:700 8px/1 var(--mono);padding:3px 5px;letter-spacing:.1em}
.pager{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.pager .info{font:600 10px/1 var(--mono);letter-spacing:.14em;color:var(--grey)}
.pager .info b{color:var(--paper)}

/* ---------- 计划 / 图例（大概版） ---------- */
.plan{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;border:2px solid var(--paper);margin-bottom:10px}
.plan .l{padding:12px 14px;border-right:2px solid var(--paper)}
.plan h3{margin:0;font-family:var(--disp);font-weight:400;font-size:26px;line-height:1.02}
.plan .roles{margin-top:6px;font:11px/1.5 var(--mono);color:var(--grey)}
.plan .r{padding:12px 14px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.plan .r span{border:1px solid var(--grey);font:600 9.5px/1 var(--mono);padding:4px 6px;color:var(--paper)}
.legend table{width:100%;border-collapse:collapse}
.legend th,.legend td{border:1px solid #2c2c2a;padding:7px 9px;text-align:left;font-size:12.5px;vertical-align:top}
.legend th{font:700 9.5px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--grey);background:#131313}
.legend td b{font-family:var(--latin);font-size:15px}

/* ---------- 浮窗 ---------- */
.pop{position:fixed;z-index:90;width:360px;max-height:76vh;overflow:auto;background:var(--paper);color:var(--ink);
  display:none;padding:14px 15px 16px;box-shadow:0 30px 60px -22px rgba(0,0,0,.7);border-top:6px solid var(--fluoro)}
.pop.on{display:block;animation:pin .18s ease both}
@keyframes pin{from{opacity:0;transform:translateY(6px) scale(.985)}to{opacity:1;transform:none}}
.pop .pt{display:flex;justify-content:space-between;gap:10px}
.pop h4{margin:0;font:700 12.5px/1.35 var(--mono);word-break:break-all}
.pop .x{border:0;background:none;cursor:pointer;font:400 22px/1 var(--marker);color:#8a8272}
.pop .x:hover{color:var(--magenta)}
.pop .tags{margin:8px 0;display:flex;flex-wrap:wrap;gap:5px}
.pop .tags i{font-style:normal;border:1px solid #b9b09a;padding:3px 6px;font:600 9px/1 var(--mono);color:#4a443a}
.pop .tags i.hot{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.pop .row{margin:0 0 7px}
.pop .row b{display:block;font:700 8.5px/1.6 var(--mono);letter-spacing:.16em;color:#8a8272;text-transform:uppercase}
.pop .row p{margin:0;font:13px/1.55 var(--kai);color:#2f2a23}
.pop .url{font:600 10px/1.4 var(--mono);color:#1f5c8a;word-break:break-all;margin-top:6px}
.pop .closehint{position:absolute;right:12px;bottom:6px;font:400 13px/1 var(--kai);color:#a49a86}

@media (max-width:1000px){
  .entries{grid-template-columns:1fr 1fr}
  .hero{height:380px}.hero h1{font-size:52px}
  .viz,.dlead,.plan{grid-template-columns:1fr}
  .mast h1{font-size:46px}
  .rej{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header class="hud">
  <span class="brand">ARCHIVE<span>.</span></span>
  <nav class="navlinks" id="nav">
    <a href="#/home">首页</a><a href="#/daily">日报</a><a href="#/library">全库</a>
    <a href="#/plans">计划</a><a href="#/legend">图例</a>
  </nav>
  <span class="sp"></span>
  <span class="meta">ITEMS <b id="hTotal">—</b> ｜ REC <b id="hRec">—</b> ｜ <b id="hDate">—</b></span>
  <button class="snd" id="snd" aria-pressed="false">SOUND OFF</button>
</header>

<!-- 首页 -->
<section class="view on" id="v-home">
  <div class="hero">
    <div class="bg" id="heroBg"></div>
    <span class="num" id="heroNum">—</span>
    <div class="in">
      <span class="k">LOCAL ARCHIVE · 一级页面</span>
      <h1 class="h1">本地开源<br>项目<em>档案</em></h1>
      <p class="dek" id="heroDek">—</p>
    </div>
  </div>
  <div class="entries" id="entries"></div>
  <div class="viz">
    <div class="box"><div class="h"><span class="lab">分类分布 / L1</span><span class="lab" id="l1n">—</span></div><div id="catRows"></div></div>
    <div class="box"><div class="h"><span class="lab">近 7 天事件</span><span class="lab" id="spN">—</span></div><div class="spark" id="spark"></div></div>
  </div>
</section>

<!-- 日报 -->
<section class="view" id="v-daily">
  <div class="mast">
    <h1 class="h1">DAILY<span style="color:var(--fluoro)">.</span></h1>
    <div class="right"><b id="dNo">NO.—</b><span id="dDate">—</span><span id="dWeek">—</span></div>
  </div>
  <div class="dstats" id="dStats"></div>
  <div class="dlead" id="dLead"></div>
  <div id="dRest"></div>
  <div class="rej"><div class="tt">REJECTED</div><div class="items" id="dRej"></div></div>
</section>

<!-- 全库 -->
<section class="view" id="v-library">
  <h1 class="h1">完整项目库</h1>
  <div class="libbar">
    <label class="search"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#f4f0e3" stroke-width="2"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>
      <input id="q" placeholder="搜项目名 / 分类 / 一句话用途…（按 / 聚焦）" autocomplete="off"></label>
    <button class="btn" id="clearBtn">清空条件</button>
  </div>
  <div class="catts" id="catts"></div>
  <div class="grid" id="libGrid"></div>
  <div class="pager" id="libPager"></div>
</section>

<!-- 计划（大概版） -->
<section class="view" id="v-plans">
  <h1 class="h1">计划与工作区</h1>
  <p class="lab" style="margin:8px 0 12px">按需求配好的工具组合 · 大概版，之后会改</p>
  <div id="plans"></div>
</section>

<!-- 图例（大概版） -->
<section class="view" id="v-legend">
  <h1 class="h1">图例与标准</h1>
  <p class="lab" style="margin:8px 0 12px">档位 / 状态 / 风险 / 徽章 · 大概版，之后会改</p>
  <div class="legend" id="legend"></div>
</section>

<!-- 浮窗 -->
<div class="pop" id="pop" role="dialog">
  <div class="pt"><h4 id="popName"></h4><button class="x" id="popX">×</button></div>
  <div class="tags" id="popTags"></div>
  <div class="row"><b>它是干什么的</b><p id="popOne"></p></div>
  <div class="row"><b>为什么值得收</b><p id="popWhy"></p></div>
  <div class="row" id="popAudWrap"><b>适合谁</b><p id="popAud"></p></div>
  <div class="url" id="popUrl"></div>
  <span class="closehint">Esc 关闭</span>
</div>

<script>
const DATA = /*__DATA__*/{projects:[],daily:{},plans:[]};

/* ---------- 素材轮换：按 seed 哈希选图（同一条永远同一张，但不同条目不同） ---------- */
const IMGS = /*__IMGS__*/[];
function imgFor(seed, salt) {
  var s = String(seed) + '|' + String(salt || '');
  var h = 0; for (var i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) | 0; }
  return IMGS[Math.abs(h) % IMGS.length];
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }

/* ---------- 音效（默认关；WebAudio 合成，无音频文件） ---------- */
var AC = null, sndOn = localStorage.getItem('snd') === '1';
function beep(freq, dur) {
  if (!sndOn) { return; }
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = 'square'; o.frequency.value = freq || 660;
    g.gain.setValueAtTime(0.035, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + (dur || 0.05));
    o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + (dur || 0.05));
  } catch (e) { }
}
function sndLabel() { var b = document.getElementById('snd'); b.className = 'snd' + (sndOn ? ' on' : ''); b.textContent = sndOn ? 'SOUND ON' : 'SOUND OFF'; b.setAttribute('aria-pressed', sndOn); }
document.getElementById('snd').onclick = function () { sndOn = !sndOn; localStorage.setItem('snd', sndOn ? '1' : '0'); sndLabel(); if (sndOn) { beep(880, .06); } };
sndLabel();

/* ---------- 浮窗 ---------- */
var pop = document.getElementById('pop');
function showPop(p, ev) {
  document.getElementById('popName').textContent = p.id;
  var tags = [];
  if (p.tier) { tags.push('<i class="hot">' + esc(p.tier) + ' 档</i>'); }
  tags.push('<i>' + esc(p.l1) + ' / ' + esc(p.l2) + '</i>');
  tags.push('<i>★ ' + (p.stars != null ? p.stars : '—') + '</i>');
  if (p.rec) { tags.push('<i class="hot">推荐过</i>'); }
  if (p.gem) { tags.push('<i>冷门优质</i>'); }
  if (p.org) { tags.push('<i>官方出品</i>'); }
  document.getElementById('popTags').innerHTML = tags.join('');
  document.getElementById('popOne').textContent = p.one || '（缺：一句话用途）';
  document.getElementById('popWhy').textContent = p.why || '（缺：为什么值得收）';
  var aud = document.getElementById('popAudWrap');
  if (p.aud) { aud.style.display = ''; document.getElementById('popAud').textContent = p.aud; } else { aud.style.display = 'none'; }
  document.getElementById('popUrl').textContent = p.url || ('https://github.com/' + p.id);
  var r = (ev && ev.currentTarget) ? ev.currentTarget.getBoundingClientRect() : null;
  var w = 360, hgt = pop.offsetHeight || 300;
  var left = r ? r.right + 12 : (window.innerWidth - w) / 2;
  var top = r ? r.top + window.scrollY - 8 : window.scrollY + 80;
  if (left + w > window.innerWidth - 10) { left = Math.max(10, (r ? r.left : window.innerWidth / 2) - w - 12); }
  if (top + hgt > window.scrollY + window.innerHeight - 12) { top = Math.max(window.scrollY + 10, window.scrollY + window.innerHeight - hgt - 12); }
  pop.style.left = left + 'px'; pop.style.top = top + 'px'; pop.classList.add('on');
  beep(720, .05);
}
function hidePop() { pop.classList.remove('on'); }
document.getElementById('popX').onclick = function () { hidePop(); beep(420, .04); };
document.addEventListener('click', function (e) { if (!e.target.closest('.pop') && !e.target.closest('[data-pid]')) { hidePop(); } });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { hidePop(); } });

/* ---------- 首页 ---------- */
function renderHome() {
  var S = DATA.stats || {}, P = DATA.projects || [];
  document.getElementById('heroBg').style.backgroundImage = 'url("' + imgFor('home', DATA.daily.date) + '")';
  document.getElementById('heroNum').textContent = S.total || P.length;
  document.getElementById('heroDek').textContent = '共 ' + (S.total || P.length) + ' 条档案 · ' + (S.l1 || 0)
    + ' 个一级分类 · 最近一期 ' + (DATA.daily.date || '—') + ' ｜ 全部离线、可搜索、可点开细看';
  var E = [
    { no: '01', t: '每日精选', d: (DATA.daily.picks || []).length + ' 条今天推荐', href: '#/daily', sel: true },
    { no: '02', t: '完整项目库', d: (S.total || P.length) + ' 条可搜可筛', href: '#/library' },
    { no: '03', t: '计划与工作区', d: (DATA.plans || []).length + ' 个方案', href: '#/plans' },
    { no: '04', t: '图例与标准', d: '档位 / 状态 / 风险', href: '#/legend' }
  ];
  document.getElementById('entries').innerHTML = E.map(function (e) {
    return '<a class="entry' + (e.sel ? ' sel' : '') + '" href="' + e.href + '"><span class="n">' + e.no + '</span>'
      + '<span class="t">' + e.t + '</span><span class="d">' + e.d + '</span></a>';
  }).join('');
  var cat = S.cats || [], mx = 1; cat.forEach(function (c) { if (c.n > mx) { mx = c.n; } });
  document.getElementById('catRows').innerHTML = cat.map(function (c, i) {
    return '<div class="catrow"><span>' + esc(c.l1) + '</span><span class="b"><i class="' + (i < 2 ? 'm' : '') + '" style="width:' + Math.max(3, Math.round(c.n / mx * 100)) + '%"></i></span><b>' + c.n + '</b></div>';
  }).join('');
  document.getElementById('l1n').textContent = cat.length + ' 类';
  var sp = S.spark || [], sm = 1; sp.forEach(function (s) { if (s.n > sm) { sm = s.n; } });
  document.getElementById('spark').innerHTML = sp.map(function (s) {
    return '<div class="c"><b>' + s.n + '</b><i style="height:' + Math.max(4, Math.round(s.n / sm * 100)) + '%"></i><span>' + esc(s.d) + '</span></div>';
  }).join('');
  document.getElementById('spN').textContent = (S.events || 0) + ' 事件';
}

/* ---------- 日报（循环 + 自适应） ---------- */
function renderDaily() {
  var D = DATA.daily || {}, picks = D.picks || [], rej = D.rejects || [], S = D.stats || {};
  document.getElementById('dNo').textContent = 'NO.' + (D.issue || '—');
  document.getElementById('dDate').textContent = D.date || '—';
  document.getElementById('dWeek').textContent = D.week || '';
  document.getElementById('dStats').innerHTML = [
    ['候选', S.candidates], ['推荐', picks.length], ['S/A', (S.s || 0) + '/' + (S.a || 0)],
    ['退稿', rej.length], ['新面孔', S.neu], ['老朋友', S.old], ['API', S.api]
  ].filter(function (r) { return r[1] != null; }).map(function (r) {
    return '<span>' + r[0] + ' <b>' + r[1] + '</b></span>';
  }).join('');
  // 头条：有 picks 才渲染，否则给空态（自适应 0 条）
  var lead = picks[0];
  if (lead) {
    document.getElementById('dLead').innerHTML =
      '<div class="l"><span class="k" style="display:inline-block;background:var(--fluoro);color:var(--ink);font:700 10px/1 var(--mono);padding:5px 8px">头条 / LEAD</span>'
      + '<h2>' + esc(lead.id) + '</h2><p class="dek">' + esc(lead.one) + '</p></div>'
      + '<div class="r" data-pid="' + esc(lead.id) + '" style="cursor:pointer"><div class="lab" style="color:#6d6555">点开细看</div>'
      + '<div style="font-family:var(--disp);font-size:40px;line-height:1;margin-top:6px">' + (lead.stars != null ? lead.stars : '—') + '★</div>'
      + '<div style="font:12px/1.6 var(--mono);color:#4a443a;margin-top:6px">' + esc(lead.l1) + ' / ' + esc(lead.l2) + '</div></div>';
  } else {
    document.getElementById('dLead').innerHTML = '<div class="emptyrep" style="grid-column:1/-1">今天没有达到推荐线的项目 —— 宁缺毋滥，明天再看。</div>';
  }
  // 其余 picks 循环（数量任意）
  var rest = picks.slice(1);
  document.getElementById('dRest').innerHTML = rest.length
    ? rest.map(function (p, i) {
        return '<div class="pickrow" data-pid="' + esc(p.id) + '">'
          + '<span class="no">0' + (i + 2) + '</span>'
          + '<div><div class="nm">' + esc(p.id) + '</div><div class="one">' + esc(p.one) + '</div></div>'
          + '<div class="m">' + esc(p.tier || '—') + ' 档<br>★ ' + (p.stars != null ? p.stars : '—') + '</div></div>';
      }).join('')
    : '<div class="emptyrep" style="margin-top:10px">今天只有头条这一条 —— 其余候选都没过线。</div>';
  // 退稿循环（数量任意）
  document.getElementById('dRej').innerHTML = rej.length
    ? rej.map(function (r) { return '<div class="it"><b>' + esc(r.name) + '</b><span>' + esc(r.reason) + '</span></div>'; }).join('')
    : '<div class="it"><b>（今天没有退稿）</b><span>所有候选都进了复核</span></div>';
}

/* ---------- 全库（可扩展到几万条：分页 + 搜索 + 分类） ---------- */
var LIB = { q: '', cat: '', page: 0, PER: 24, view: [] };
function libFiltered() {
  var q = LIB.q.toLowerCase();
  return (DATA.projects || []).filter(function (p) {
    if (LIB.cat && p.l1 !== LIB.cat) { return false; }
    if (!q) { return true; }
    return (p.id + ' ' + p.l1 + ' ' + p.l2 + ' ' + (p.one || '')).toLowerCase().indexOf(q) >= 0;
  });
}
function renderLib() {
  LIB.view = libFiltered();
  var pages = Math.max(1, Math.ceil(LIB.view.length / LIB.PER));
  if (LIB.page >= pages) { LIB.page = pages - 1; }
  var rows = LIB.view.slice(LIB.page * LIB.PER, LIB.page * LIB.PER + LIB.PER);
  document.getElementById('libGrid').innerHTML = rows.length ? rows.map(function (p) {
    return '<article class="pcard" data-pid="' + esc(p.id) + '" tabindex="0">'
      + '<span class="tagl">' + esc(p.l1) + '</span>'
      + '<div class="ph" style="background-image:url(\'' + imgFor(p.id, LIB.page) + '\')"></div>'
      + '<div class="bd"><div class="nm">' + esc(p.id) + '</div><p class="one">' + esc(p.one) + '</p>'
      + '<div class="ft"><span>' + esc(p.tier || '未评档') + '</span><span>★ ' + (p.stars != null ? p.stars : '—') + '</span></div></div></article>';
  }).join('') : '<div class="emptyrep" style="grid-column:1/-1">没有匹配 —— 换个词，或点「清空条件」</div>';
  var pager = [];
  pager.push('<button class="btn" id="pPrev"' + (LIB.page === 0 ? ' disabled' : '') + '>◀ 上一页</button>');
  pager.push('<span class="info">第 <b>' + (LIB.page + 1) + '</b> / <b>' + pages + '</b> 页 ｜ 命中 <b>' + LIB.view.length + '</b> 条 ｜ 每页 ' + LIB.PER + '</span>');
  pager.push('<button class="btn" id="pNext"' + (LIB.page >= pages - 1 ? ' disabled' : '') + '>下一页 ▶</button>');
  document.getElementById('libPager').innerHTML = pager.join('');
  document.getElementById('pPrev').onclick = function () { LIB.page--; renderLib(); beep(520, .04); };
  document.getElementById('pNext').onclick = function () { LIB.page++; renderLib(); beep(620, .04); };
  document.getElementById('libGrid').querySelectorAll('[data-pid]').forEach(function (el) {
    el.onclick = function (ev) { var p = LIB.view.find(function (x) { return x.id === el.getAttribute('data-pid'); }); if (p) { showPop(p, ev); } };
    el.onkeydown = function (ev) { if (ev.key === 'Enter') { el.click(); } };
  });
  var cats = {}; (DATA.projects || []).forEach(function (p) { cats[p.l1] = (cats[p.l1] || 0) + 1; });
  document.getElementById('catts').innerHTML = Object.keys(cats).map(function (k) {
    return '<button class="cat' + (LIB.cat === k ? ' on' : '') + '" data-c="' + esc(k) + '">' + esc(k) + ' <span style="opacity:.65">' + cats[k] + '</span></button>';
  }).join('');
  document.getElementById('catts').querySelectorAll('[data-c]').forEach(function (b) {
    b.onclick = function () { var c = b.getAttribute('data-c'); LIB.cat = (LIB.cat === c ? '' : c); LIB.page = 0; renderLib(); };
  });
}

/* ---------- 计划 / 图例（大概版） ---------- */
function renderPlans() {
  var ps = DATA.plans || [];
  document.getElementById('plans').innerHTML = ps.length ? ps.map(function (p) {
    return '<div class="plan"><div class="l"><h3>' + esc(p.name) + '</h3><div class="roles">' + esc(p.roles || '') + '</div>'
      + '<div class="roles" style="margin-top:8px;color:#cfcfc8">' + esc(p.why || '') + '</div></div>'
      + '<div class="r">' + (p.tools || []).map(function (t) { return '<span>' + esc(t) + '</span>'; }).join('') + '</div></div>';
  }).join('') : '<div class="emptyrep">（待补）</div>';
}
function renderLegend() {
  var rows = [
    ['档位 TIER', '<b>S</b> 立刻能用、明显好用｜<b>A</b> 值得试｜<b>B</b> 备用｜<b>未评档</b> 还没打分'],
    ['状态 STATUS', 'watch 观望｜active 活跃｜using 在用｜dropped 已弃'],
    ['风险 RISK', '<b>低</b> 无害工具｜<b>中</b> 要授权/要配置｜<b>高</b> 涉及权限或数据｜<b>红线</b> 一律不收录'],
    ['徽章 BADGE', '🧊 冷门优质｜🏢 官方出品｜★ 推荐过｜est. 冷启动估算值（不参与排序）'],
    ['币/计量', '★ = stars（本次 API 实测）｜增速 = 与上一份快照对比的真实差值']
  ];
  document.getElementById('legend').innerHTML = '<table><thead><tr><th style="width:150px">类别</th><th>含义</th></tr></thead><tbody>'
    + rows.map(function (r) { return '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td></tr>'; }).join('') + '</tbody></table>'
    + '<p class="lab" style="margin-top:10px">图例是大概版：之后会补每个字段的完整定义与示例</p>';
}

/* ---------- 路由 ---------- */
var ROUTES = { home: renderHome, daily: renderDaily, library: renderLib, plans: renderPlans, legend: renderLegend };
function route() {
  var h = (location.hash || '#/home').replace('#/', '').split('?')[0] || 'home';
  if (!ROUTES[h]) { h = 'home'; }
  document.querySelectorAll('.view').forEach(function (v) { v.classList.remove('on'); });
  var el = document.getElementById('v-' + h); if (el) { el.classList.add('on'); }
  document.querySelectorAll('#nav a').forEach(function (a) { a.classList.toggle('on', a.getAttribute('href') === '#/' + h); });
  try { ROUTES[h](); } catch (e) { console.error(h, e); }
  hidePop();
  beep(560, .04);
  window.scrollTo({ top: 0, behavior: 'auto' });
}
window.addEventListener('hashchange', route);

/* ---------- 启动 ---------- */
(function boot() {
  var S = DATA.stats || {};
  document.getElementById('hTotal').textContent = S.total != null ? S.total : (DATA.projects || []).length;
  document.getElementById('hRec').textContent = S.rec != null ? S.rec : '—';
  document.getElementById('hDate').textContent = (DATA.daily || {}).date || '—';
  document.getElementById('q').addEventListener('input', function (e) { LIB.q = e.target.value.trim(); LIB.page = 0; renderLib(); });
  document.getElementById('clearBtn').onclick = function () { LIB.q = ''; LIB.cat = ''; LIB.page = 0; document.getElementById('q').value = ''; renderLib(); };
  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); location.hash = '#/library'; setTimeout(function () { document.getElementById('q').focus(); }, 60); }
  });
  route();
})();
</script>
