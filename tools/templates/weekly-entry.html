<!-- WEEKLY_ENTRY:START -->
<style id="weekly-entry-css">
.weekly-entry{position:absolute;left:50%;top:12px;z-index:70;width:132px;padding:9px 10px;background:#c81f16;color:#fff;text-decoration:none;display:flex;flex-direction:column;gap:2px;transform:translateX(-50%) rotate(-3deg);box-shadow:7px 7px 0 rgba(10,10,9,.38)}
.weekly-entry .we-k{font:700 8px/1.2 ui-monospace,Consolas,monospace;letter-spacing:.14em;color:#ffd7d2}
.weekly-entry .we-t{font:700 8px/1.3 ui-monospace,Consolas,monospace;color:#fff}
.weekly-entry .we-a{font:400 25px/.8 "Anton",Impact,sans-serif;letter-spacing:-.02em;color:#fff;margin-top:2px}
.weekly-entry:hover{transform:translateX(-50%) translate(-2px,-2px) rotate(-1deg)}
@media(max-width:620px){.weekly-entry{top:auto;bottom:12px;width:112px;padding:7px 8px}.weekly-entry .we-a{font-size:20px}}
@media print{.weekly-entry{display:none!important}}
</style>
<a class="weekly-entry" href="{{FILE}}" aria-label="打开 {{ISSUE}} 周报">
<span class="we-k">WEEKLY / {{ISSUE}}</span><span class="we-t">{{RANGE}}</span><span class="we-a">周报 ↗</span>
</a>
<!-- WEEKLY_ENTRY:END -->
